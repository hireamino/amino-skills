name: conformance

# Guards the Python skill surface against the correctness spec (conformance/SPEC.md).
# Deterministic, no network. See the epic: three-way correctness parity (Skill/Web/Action).

on:
  push:
    paths:
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/scripts/**'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/SKILL.md'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/references/**'
      - 'conformance/**'
      - 'FAQ.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/scripts/**'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/SKILL.md'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/references/**'
      - 'conformance/**'
      - 'FAQ.md'
      - 'README.md'
      - 'CONTRIBUTING.md'

jobs:
  conformance:
    name: conformance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure-function conformance checks
        run: python3 conformance/check.py
      - name: Address contract differential against reviewed base
        run: python3 conformance/address_differential.py
      - name: Existing-fixture output preservation
        run: python3 conformance/preservation.py
      - name: Fixtures-driven conformance runner (shared corpus)
        run: python3 conformance/run_py.py
      - name: Mutation canaries (material contract + network kill switch)
        run: python3 conformance/canary_py.py
