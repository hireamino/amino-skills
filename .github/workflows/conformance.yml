name: conformance

# Guards the Python skill surface against the correctness spec (conformance/SPEC.md).
# Deterministic, no network. See the epic: three-way correctness parity (Skill/Web/Action).

on:
  push:
    paths:
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/scripts/**'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/SKILL.md'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/references/**'
      - 'conformance/**'
      - 'public-suffix/**'
      - 'faq/**'
      - 'FAQ.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths:
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/scripts/**'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/SKILL.md'
      - 'amino-deliverability-audit/skills/amino-deliverability-audit/references/**'
      - 'conformance/**'
      - 'public-suffix/**'
      - 'faq/**'
      - 'FAQ.md'
      - 'README.md'
      - 'CONTRIBUTING.md'

jobs:
  conformance:
    name: conformance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Public DMARC-discovery claims match observed behaviour
        run: node conformance/dmarc-discovery-claims.mjs --surface skill
      - name: Canonical audit FAQ artifact, generator and claim canary
        run: |
          node faq/test-audit-faq.mjs
          node faq/claim-canary.mjs
      - name: Pure-function conformance checks
        run: python3 conformance/check.py
      - name: Address contract differential against reviewed base
        run: python3 conformance/address_differential.py
      - name: Existing-fixture output preservation
        run: python3 conformance/preservation.py
      - name: Fixtures-driven conformance runner (shared corpus)
        run: python3 conformance/run_py.py
      - name: Published batch lane-output corpus
        run: |
          python3 conformance/batch_contract.py
          python3 conformance/batch_canary.py
      - name: Mutation canaries (material contract + network kill switch)
        run: python3 conformance/canary_py.py
      - name: Pinned public-suffix artifact (offline)
        run: |
          python3 public-suffix/verify.py
          python3 public-suffix/test_generator.py
      - name: Python skill official public-suffix vectors
        run: python3 public-suffix/run_vectors.py --name python-skill -- python3 public-suffix/adapters/skill.py amino-deliverability-audit/skills/amino-deliverability-audit/scripts/audit.py
      - name: Python public-suffix fallback mutation canary
        run: python3 public-suffix/adoption_canary.py
      - name: Public-suffix differential detector canary
        run: python3 public-suffix/differential_canary.py
